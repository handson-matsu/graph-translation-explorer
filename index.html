<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>グラフの平行移動ラボ</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand">↗ 数学の実験室 <span>GRAPH LAB</span></div><button id="reset" class="quiet">↺ 初期状態に戻す</button></header><main><div class="intro"><p class="eyebrow">見て、動かして、理由を見つけよう</p><h1>式の「−」で、グラフはどこへ？</h1><p>同じ x を入れて、2つのグラフと値を比べよう。</p></div><section class="controls card" aria-label="関数と移動量"><div><label for="kind">元の関数</label><select id="kind"><option value="quadratic">二次関数 y = ax²</option><option value="linear">一次関数 y = ax + b</option></select><div class="coeff"><label>a <input id="a" type="number" min="-3" max="3" step="0.5" value="1"></label><label id="b-wrap" hidden>b <input id="b" type="number" min="-5" max="5" step="0.5" value="0"></label></div></div><div><label for="p">横への移動 <strong id="p-value"></strong></label><input id="p" type="range" min="-5" max="5" step="0.5" value="2"><div class="ends"><span>← 左 −5</span><span>右 +5 →</span></div></div><div><label for="q">縦への移動 <strong id="q-value"></strong></label><input id="q" type="range" min="-5" max="5" step="0.5" value="0"><div class="ends"><span>↓ 下 −5</span><span>上 +5 ↑</span></div></div></section>
<div class="workspace"><section class="card graph-card"><div class="section-top"><h2>グラフで見る</h2><div class="legend"><span class="original">● 元のグラフ</span><span class="moved">● 移動後</span></div></div><div class="formulas"><span id="original-formula" class="original"></span><span id="moved-formula" class="moved"></span></div><svg id="graph" viewBox="0 0 640 480" role="img" aria-label="元の関数と移動後の関数のグラフ"></svg><div class="comparison-bar"><button id="compare" class="quiet">同じ x で比較</button><span id="comparison-x"></span></div><p id="point-caption" class="caption" aria-live="polite"></p><div class="graph-bottom"><label for="source-x">移動を追う点の x</label><input id="source-x" type="number" min="-10" max="10" step="0.5" value="1"><button id="animate">▶ 点の移動を見る</button></div><p class="animation-note">点の移動は (a, f(a)) → (a + p, f(a) + q)</p></section>
<section class="card table-card"><div class="section-top"><h2>同じ x を代入して比べる</h2><span class="badge">数表</span></div><div class="table-options"><label for="table-step">間隔<select id="table-step"><option value="1">1刻み</option><option value="0.5">0.5刻み</option></select></label><label for="table-min">x の最小<input id="table-min" type="number" min="-10" max="10" step="0.5" value="-2"></label><label for="table-max">x の最大<input id="table-max" type="number" min="-10" max="10" step="0.5" value="2"></label></div><p id="range-feedback" role="status" hidden></p><div class="table-scroll"><table><thead><tr><th scope="col" class="matching">x</th><th scope="col" class="original">元の y</th><th scope="col" class="matching" id="input-heading">x − 2</th><th scope="col" class="moved">新しい y</th></tr></thead><tbody id="rows"></tbody></table></div><p class="table-note">行を選ぶと、同じ x 上の2点を表示します。</p></section></div><footer>グラフの平行移動ラボ</footer></main><script src="app.js"></script></body></html>
